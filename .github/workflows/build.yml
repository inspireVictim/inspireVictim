name: build profile cards

on:
  schedule:
    - cron: "17 3 * * *"        # каждый день в 03:17 UTC
  workflow_dispatch:            # кнопка "Run workflow" вручную
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "build.py"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - run: python build.py

      - name: commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh profile cards"
          git push
